# fly.toml app configuration file generated for omnivote-api on 2026-08-13T01:37:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'omnivote-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'alembic upgrade head'

[processes]
  web = 'uvicorn app.main:app --host 0.0.0.0 --port 8000'
  worker = 'arq app.workers.worker.WorkerSettings'

[[services]]
  protocol = 'tcp'
  internal_port = 8000
  processes = ['web']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '1s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
